name: PR Comment Deploy Setup

on:
  workflow_call:
    outputs:
      should_deploy:
        description: 'Whether deployment should proceed'
        value: ${{ jobs.check-comment.outputs.should_deploy }}
      pr_ref:
        description: 'The PR branch reference'
        value: ${{ jobs.check-comment.outputs.pr_ref }}
      pr_sha:
        description: 'The PR head SHA'
        value: ${{ jobs.check-comment.outputs.pr_sha }}
      pr_number:
        description: 'The PR number'
        value: ${{ jobs.check-comment.outputs.pr_number }}

jobs:
  check-comment:
    runs-on: ubuntu-latest
    # Cheap pre-filter only, so we don't spin a runner for every comment. Expressions
    # have no trim(), so exact matching happens in the `check` step below.
    if: |
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/deploy')
    permissions:
      pull-requests: write
      issues: write
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      pr_ref: ${{ steps.pr-info.outputs.ref }}
      pr_sha: ${{ steps.pr-info.outputs.sha }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - name: Set deployment outputs
        id: check
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          # GitHub's web UI appends CRLF, so `/deploy` typed in the browser arrives as
          # "/deploy\r\n". Normalize before matching: drop CRs, keep the first line,
          # lowercase (the job-level `startsWith` above is case-insensitive, so `/Deploy`
          # from a mobile keyboard must match here too), then strip surrounding whitespace.
          deploy_command=$(printf '%s' "$COMMENT_BODY" \
            | tr -d '\r' \
            | head -n 1 \
            | tr '\t' ' ' \
            | tr '[:upper:]' '[:lower:]' \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          # Accept `/deploy` and `/deploy <args>`, but not `/deployment-notes`.
          if [ "$deploy_command" = "/deploy" ] || [ "${deploy_command#/deploy }" != "$deploy_command" ]; then
            echo "Deploy command detected on PR #${PR_NUMBER}"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a deploy command, skipping deploy: '${deploy_command}'"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Add reaction to comment
        if: steps.check.outputs.should_deploy == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            })

      - name: Get PR information
        id: pr-info
        uses: actions/github-script@v7
        env:
          SHOULD_DEPLOY: ${{ steps.check.outputs.should_deploy }}
        with:
          script: |
            if (process.env.SHOULD_DEPLOY !== 'true') {
              core.setOutput('ref', '');
              core.setOutput('sha', '');
              return;
            }

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('sha', pr.data.head.sha);
